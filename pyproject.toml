[project]
name = "mcops"
version = "0.1.0"
description = "自托管 Minecraft（Fabric）服务器的一体化运维平台：Web 面板、备份回退、升级、安全审计、QQ 机器人"
authors = [{ name = "WangSimiao2000" }]
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["minecraft", "fabric", "server", "ops", "backup", "restic"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "aiosqlite==0.22.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "pyotp==2.10.0",
    "pyyaml==6.0.3",
    "qq-botpy==1.2.1",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn[standard]==0.54.0",
]

[project.urls]
Homepage = "https://github.com/WangSimiao2000/mcops"
Issues = "https://github.com/WangSimiao2000/mcops/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[project.scripts]
mcops-agent = "mcops.main:run"
mcops = "mcops.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
# ASYNC109/110/240：本地小文件 stat 与轮询等待在这里是有意为之
# E501：中文说明文字较长，代码行宽由 ruff format 保证
ignore = ["ASYNC230", "E501", "S101", "RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC110", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# dev 脚本只访问写死的 https 地址（Fabric Meta / Modrinth）
"dev/**" = ["S310"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["botpy", "botpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
