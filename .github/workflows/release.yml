name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要标签
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build offline bundle
        run: |
          bash deploy/make-bundle.sh "mcops-${GITHUB_REF_NAME}" --tar
          sha256sum "mcops-${GITHUB_REF_NAME}.tar.gz" > "mcops-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "mcops-${GITHUB_REF_NAME}.tar.gz" "mcops-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes-file <(awk -v h="## ${GITHUB_REF_NAME#v}" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md)
